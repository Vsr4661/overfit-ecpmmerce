# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: overfit
      POSTGRES_PASSWORD: overfit
      POSTGRES_DB: overfit
    ports:
      - "5433:5432"
    volumes:
      - overfit-db:/var/lib/postgresql/data
volumes:
  overfit-db:
